{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Case follow-up · Ovoz{% endblock %}
{% block nav %}
  <div class="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
{% endblock %}
{% block content %}
<div class="wrap">
  <h1 data-i18n="c_title"></h1>
  <p class="muted" data-i18n="c_sub"></p>
  <div class="card">
    <label for="code" class="q" data-i18n="c_code"></label>
    <input type="text" id="code" placeholder="ABCD-2345" autocomplete="off" autocapitalize="characters"
           style="text-transform:uppercase;font:700 1.3rem ui-monospace,Menlo,monospace;letter-spacing:.08em;text-align:center">
    <button id="open" class="block" style="margin-top:12px">{{ icon("search", 20) }}<span data-i18n="c_open"></span></button>
    <div id="error" class="note bad hidden"></div>
  </div>

  <div id="thread" class="hidden">
    <div id="msgs"></div>
    <div class="card">
      <label for="reply" class="q" data-i18n="c_reply"></label>
      <textarea id="reply" style="min-height:90px" maxlength="2000"></textarea>
      <button id="send" class="block" style="margin-top:12px" data-i18n="c_send"></button>
      <div id="ok" class="note ok hidden"></div>
    </div>
  </div>
  <div id="review" class="card hidden"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/i18n.js?v={{ V }}"></script>
<script src="/static/review.js?v={{ V }}"></script>
<script>
  const TERMS_VERSION = {{ TERMS_VERSION|tojson }};
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  async function load() {
    $("error").classList.add("hidden"); $("ok").classList.add("hidden");
    const r = await fetch("/api/case/open", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: $("code").value }) });
    if (!r.ok) {
      $("thread").classList.add("hidden");
      $("error").textContent = r.status === 404 ? t("c_notfound") : t("err");
      $("error").classList.remove("hidden"); return;
    }
    const j = await r.json();
    $("msgs").innerHTML = j.messages.length ? j.messages.map(m =>
      `<div class="msg ${m.sender}"><div class="small muted">${m.sender === "clinic" ? t("c_clinic") : t("c_you")} · ${esc(m.created_day)}</div>${esc(m.body)}</div>`
    ).join("") : `<p class="muted">${t("c_none")}</p>`;
    $("thread").classList.remove("hidden");
  }
  $("open").addEventListener("click", load);
  $("code").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); load(); } });
  // Replies get the same "check what will be sent, then agree" step as reports.
  $("send").addEventListener("click", async () => {
    const body = $("reply").value.trim(); if (!body) return;
    let p;
    try { p = await previewText(body); } catch (e) { return; }
    showReview({
      box: $("review"), hide: [$("thread")], masked: p.masked, rows: () => [],
      onAgree: async () => {
        const r = await fetch("/api/case/reply", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: $("code").value, body, agree: true, terms_version: TERMS_VERSION }) });
        if (!r.ok) throw new Error(r.status);
        $("review").classList.add("hidden"); $("thread").classList.remove("hidden");
        $("reply").value = "";
        await load();
        $("ok").textContent = t("c_sent"); $("ok").classList.remove("hidden");
      },
    });
  });
  document.addEventListener("langchange", () => { if (!$("thread").classList.contains("hidden")) load(); });
</script>
{% endblock %}
