{% extends "base.html" %}
{% block title %}Clinic login · Ovoz{% endblock %}
{% block content %}
<div class="wrap narrow">
  <h1 data-i18n="li_title">Clinic login</h1>
  <form class="card" method="post" action="/login">
    <label for="clinic" data-i18n="clinic_code">Clinic code</label>
    <input id="clinic" name="clinic" value="{{ slug or '' }}" autocapitalize="off" autocomplete="username" required
           {% if not slug %}autofocus{% endif %}>
    <label for="password" data-i18n="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required
           {% if slug %}autofocus{% endif %}>
    {% if error %}<div class="note bad" style="margin-top:10px" data-i18n="li_error">Wrong clinic code or password.</div>{% endif %}
    <button type="submit" class="block" style="margin-top:16px" data-i18n="li_btn">Log in</button>
    <p class="small muted" style="margin-top:12px"><span data-i18n="li_new">New clinic?</span>
      <a href="/signup" data-i18n="li_signup">Sign up</a></p>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/i18n.js?v={{ V }}"></script>
<script src="/static/i18n-clinic.js?v={{ V }}"></script>
{% endblock %}
