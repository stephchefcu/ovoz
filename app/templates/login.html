{% extends "base.html" %}
{% block title %}Clinic login · Ovoz{% endblock %}
{% block content %}
<div class="wrap" style="max-width:420px">
  <h1>Clinic login</h1>
  <p class="muted">Only authorised clinic staff (director, quality officer) can open the dashboard.</p>
  <form class="card" method="post" action="/login">
    <label for="clinic">Clinic code</label>
    <input id="clinic" name="clinic" value="{{ slug or '' }}" autocapitalize="off" autocomplete="username" required
           {% if not slug %}autofocus{% endif %}>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required
           {% if slug %}autofocus{% endif %}>
    {% if error %}<div class="note bad" style="margin-top:10px">Wrong clinic code or password.</div>{% endif %}
    <div class="row" style="margin-top:12px"><button type="submit">Log in</button></div>
    <p class="small muted" style="margin-top:12px">New clinic? <a href="/signup">Sign up</a></p>
  </form>
</div>
{% endblock %}
