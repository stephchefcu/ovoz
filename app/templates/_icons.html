{# Simple line icons (inline SVG, inherit the text colour). Usage: {% from "_icons.html" import icon %} {{ icon("lock") }} #}
{% macro icon(name, size=22, cls="") -%}
<svg class="ico {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "lock" -%}
  <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == "alert" -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.4v.1"/>
{%- elif name == "user" -%}
  <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
{%- elif name == "users" -%}
  <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20.5c0-3.6 2.9-5.8 6.5-5.8s6.5 2.2 6.5 5.8"/>
  <circle cx="17" cy="9" r="2.7"/><path d="M16.8 14.6c2.9.1 4.7 2 4.7 5"/>
{%- elif name == "good" -%}
  <circle cx="12" cy="12" r="9"/><path d="M8.5 14.2c.9 1.4 2.1 2.1 3.5 2.1s2.6-.7 3.5-2.1"/><path d="M9 9.8v.1"/><path d="M15 9.8v.1"/>
{%- elif name == "ok" -%}
  <circle cx="12" cy="12" r="9"/><path d="M8.5 15h7"/><path d="M9 9.8v.1"/><path d="M15 9.8v.1"/>
{%- elif name == "bad" -%}
  <circle cx="12" cy="12" r="9"/><path d="M8.5 16.4c.9-1.4 2.1-2.1 3.5-2.1s2.6.7 3.5 2.1"/><path d="M9 9.8v.1"/><path d="M15 9.8v.1"/>
{%- elif name == "mic" -%}
  <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>
{%- elif name == "check" -%}
  <circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.8 2.8 5.2-5.6"/>
{%- elif name == "shield" -%}
  <path d="M12 3l7 3v5.5c0 4.6-3 7.8-7 9.5-4-1.7-7-4.9-7-9.5V6z"/>
{%- elif name == "clipboard" -%}
  <rect x="5.5" y="4.5" width="13" height="16.5" rx="2"/><path d="M9 4.5h6V7H9z"/><path d="M9 12h6"/><path d="M9 16h4"/>
{%- elif name == "send" -%}
  <path d="M21 3.5L3 11l7 2.5L12.5 21z"/><path d="M10 13.5l11-10"/>
{%- elif name == "search" -%}
  <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
{%- elif name == "chevron" -%}
  <path d="M9 6l6 6-6 6"/>
{%- elif name == "building" -%}
  <rect x="4" y="3.5" width="16" height="17.5" rx="1.5"/><path d="M9 21v-4h6v4"/><path d="M12 7v5"/><path d="M9.5 9.5h5"/>
{%- elif name == "copy" -%}
  <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>
{%- endif -%}
</svg>
{%- endmacro %}
