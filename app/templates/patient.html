{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}{{ ward.name_uz or ward.name }} · Ovoz{% endblock %}
{% block content %}
<div class="wrap">
  <div id="form">
    <div class="eyebrow">{{ clinic.name }} ·
      <span id="wardname" data-name-en="{{ ward.name }}" data-name-uz="{{ ward.name_uz or '' }}" data-name-ru="{{ ward.name_ru or '' }}">{{ ward.name }}</span></div>
    <h1 data-i18n="p_title"></h1>

    <button type="button" class="help" id="helpbtn">{{ icon("alert") }}<span data-i18n="help_btn"></span></button>
    <div id="helpbox" class="helpbox hidden">
      <b data-i18n="help_now"></b>
      <div class="small" style="margin-top:6px" data-i18n="help_also"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div id="whoblock">
        <div class="step"><span class="n">1</span><span data-i18n="who_q"></span></div>
        <div class="choices" id="who">
          <button type="button" class="choice" data-v="patient">{{ icon("user") }}<span data-i18n="who_patient"></span></button>
          <button type="button" class="choice" data-v="relative">{{ icon("users") }}<span data-i18n="who_relative"></span></button>
        </div>
      </div>

      <div id="rateblock">
        <div class="step"><span class="n">2</span><span data-i18n="how_q"></span> <span class="opt" data-i18n="optional"></span></div>
        <div class="choices three" id="faces">
          <button type="button" class="choice" data-v="5">{{ icon("good") }}<span data-i18n="f_good"></span></button>
          <button type="button" class="choice" data-v="3">{{ icon("ok") }}<span data-i18n="f_ok"></span></button>
          <button type="button" class="choice" data-v="1">{{ icon("bad") }}<span data-i18n="f_bad"></span></button>
        </div>
      </div>

      <div class="step"><span class="n" id="n3">3</span><label for="text" style="margin:0" data-i18n="p_what"></label></div>
      <button type="button" class="rec" id="recbtn">{{ icon("mic") }}<span class="lbl"></span></button>
      <div id="recstatus" class="note info hidden"></div>
      <textarea id="text" data-i18n-ph="p_ph" maxlength="3000" style="margin-top:10px"></textarea>

      <div id="error" class="note bad hidden"></div>
      <button id="send" class="block" style="margin-top:14px" data-i18n="submit"></button>
    </div>

    {% if tg %}<p class="small" style="margin-top:14px"><a href="{{ tg }}" data-i18n="tg_open"></a></p>{% endif %}
  </div>

  <div id="review" class="card hidden"></div>

  <div id="done" class="done hidden">
    {{ icon("check", 56) }}
    <h1 data-i18n="done_title"></h1>
    <div id="urgentnote" class="note bad hidden" data-i18n="done_urgent"></div>
    <div id="seriousnote" class="note warn hidden" data-i18n="serious_note"></div>
    <div id="bribenote" class="note info hidden" data-i18n="bribe_note"></div>
    <p data-i18n="done_code"></p>
    <div class="codebox"><div class="code" id="code"></div>
      <button class="ghost" id="copy" aria-label="Copy">{{ icon("copy", 20) }}</button></div>
    <p class="muted small" data-i18n="done_follow"></p>
    <a class="btn ghost block" href="/case" data-i18n="done_check"></a>
    <button class="ghost block" id="again" data-i18n="again" style="margin-top:8px;border:0;background:none"></button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/i18n.js?v={{ V }}"></script>
<script src="/static/record.js?v={{ V }}"></script>
<script src="/static/review.js?v={{ V }}"></script>
<script>
  const WARD = {{ ward.code|tojson }};
  const TERMS_VERSION = {{ TERMS_VERSION|tojson }};
  const PRIVACY_URL = "/privacy?c=" + encodeURIComponent({{ clinic.slug|tojson }});
  const CLINIC_NAME = {{ clinic.name|tojson }};
  const FACE = { 5: "f_good", 3: "f_ok", 1: "f_bad" };
  let who = null, rating = null, urgent = false;
  const $ = id => document.getElementById(id);

  function pick(groupId, setter, canClear) {
    document.querySelectorAll(`#${groupId} .choice`).forEach(b => b.addEventListener("click", () => {
      const clear = canClear && b.classList.contains("on");   // tap a face again to clear it
      document.querySelectorAll(`#${groupId} .choice`).forEach(x => { x.classList.remove("on"); x.setAttribute("aria-pressed", "false"); });
      if (!clear) { b.classList.add("on"); b.setAttribute("aria-pressed", "true"); }
      setter(clear ? null : b.dataset.v);
    }));
  }
  pick("who", v => { who = v; $("error").classList.add("hidden"); }, false);
  pick("faces", v => { rating = v ? +v : null; }, true);

  // "Someone needs help NOW": what to do right now comes first; the report is then marked urgent.
  $("helpbtn").addEventListener("click", () => {
    urgent = true; rating = null;
    $("helpbox").classList.remove("hidden");
    $("helpbtn").classList.add("hidden");
    $("rateblock").classList.add("hidden");
    $("n3").textContent = "2";
    $("text").focus();
  });

  document.addEventListener("DOMContentLoaded", () => {
    setupRecorder({ button: $("recbtn"), status: $("recstatus"), textarea: $("text") });
  });
  function showError(msg) { $("error").textContent = msg; $("error").classList.remove("hidden"); }

  // Step 1: "Send" shows exactly what will be stored. Step 2: they tick "I agree" and send.
  $("send").addEventListener("click", async () => {
    const text = $("text").value.trim();
    $("error").classList.add("hidden");
    if (!who && !urgent) { $("whoblock").scrollIntoView({ behavior: "smooth" }); return showError(t("need_who")); }
    if (text.length < 5) return showError(t("too_short"));
    $("send").disabled = true;
    let p;
    try { p = await previewText(text); } catch (e) { $("send").disabled = false; return showError(t("err")); }
    $("send").disabled = false;
    const reporter = who || "patient";
    showReview({
      box: $("review"), hide: [$("form")], masked: p.masked, flags: p.flags,
      rows: () => {
        const rows = [
          [t("p_ward"), $("wardname").textContent],
          [t("rv_role"), t(reporter === "relative" ? "role_relative" : "role_patient")],
        ];
        if (urgent) rows.push(["", t("rv_urgent")]);
        else if (rating) rows.push([t("rv_rating"), t(FACE[rating])]);
        rows.push([t("rv_date"), partOfDay(p)]);
        return rows;
      },
      onAgree: async () => {
        const r = await fetch("/api/report", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: "patient", ward_code: WARD, text, lang: LANG, rating, reporter, urgent,
                                 agree: true, terms_version: TERMS_VERSION }) });
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        $("code").textContent = j.case_code;
        $("urgentnote").classList.toggle("hidden", !j.urgent);
        $("seriousnote").classList.toggle("hidden", !(j.serious && !j.urgent));
        $("bribenote").classList.toggle("hidden", !j.bribery);
        $("review").classList.add("hidden"); $("done").classList.remove("hidden");
        window.scrollTo(0, 0);
      },
    });
  });
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("code").textContent); $("copy").classList.add("on"); } catch (e) {}
  });
  $("again").addEventListener("click", () => {
    $("text").value = ""; rating = null; who = null; urgent = false; $("n3").textContent = "3";
    document.querySelectorAll(".choice").forEach(x => { x.classList.remove("on"); x.setAttribute("aria-pressed", "false"); });
    $("helpbox").classList.add("hidden"); $("helpbtn").classList.remove("hidden"); $("rateblock").classList.remove("hidden");
    $("done").classList.add("hidden"); $("form").classList.remove("hidden");
  });
</script>
{% endblock %}
