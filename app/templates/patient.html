{% extends "base.html" %}
{% block title %}{{ ward.name }}{% endblock %}
{% block nav %}
  <div class="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
{% endblock %}
{% block content %}
<div class="wrap">
  <div id="form">
    <h1 data-i18n="p_title"></h1>
    <p class="muted" data-i18n="p_sub"></p>
    <div class="note warn small" data-i18n="emergency"></div>

    <div class="card">
      <div class="muted small"><span data-i18n="p_ward"></span>: <b>{{ ward.name }}</b></div>

      <label data-i18n="p_rating"></label>
      <div class="stars" id="stars">
        {% for i in range(1,6) %}<button type="button" data-v="{{ i }}">★</button>{% endfor %}
      </div>

      <label for="text" data-i18n="p_what"></label>
      <div class="row" style="margin-bottom:8px">
        <button type="button" class="rec" id="recbtn">🎤</button>
      </div>
      <div id="recstatus" class="note info hidden"></div>
      <textarea id="text" data-i18n-ph="p_ph" maxlength="3000"></textarea>

      <div id="error" class="note bad hidden"></div>
      <div class="row" style="margin-top:12px"><button id="send" data-i18n="submit"></button></div>
    </div>

    <div class="card soft privacy">
      <h3 data-i18n="priv_title"></h3>
      <ul>
        <li data-i18n="priv_no"></li>
        <li data-i18n="priv_audio"></li>
        <li data-i18n="priv_yes"></li>
      </ul>
    </div>
  </div>

  <div id="done" class="hidden">
    <h1 data-i18n="done_title"></h1>
    <div id="urgentnote" class="note warn hidden" data-i18n="done_urgent"></div>
    <p data-i18n="done_code"></p>
    <div class="code" id="code"></div>
    <p class="muted small"><span data-i18n="done_follow"></span> <a href="/case">/case</a></p>
    <button class="ghost" id="again" data-i18n="again"></button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/i18n.js"></script>
<script src="/static/record.js"></script>
<script>
  const WARD = {{ ward.code|tojson }};
  let rating = null;
  const $ = id => document.getElementById(id);
  document.querySelectorAll("#stars button").forEach(b => b.addEventListener("click", () => {
    rating = +b.dataset.v;
    document.querySelectorAll("#stars button").forEach(x => x.classList.toggle("on", +x.dataset.v <= rating));
  }));
  document.addEventListener("DOMContentLoaded", () => {
    setupRecorder({ button: $("recbtn"), status: $("recstatus"), textarea: $("text") });
  });
  $("send").addEventListener("click", async () => {
    const text = $("text").value.trim();
    $("error").classList.add("hidden");
    if (text.length < 5) { $("error").textContent = t("too_short"); $("error").classList.remove("hidden"); return; }
    $("send").disabled = true; $("send").textContent = t("sending");
    try {
      const r = await fetch("/api/report", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source: "patient", ward_code: WARD, text, lang: LANG, rating }) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      $("code").textContent = j.case_code;
      $("urgentnote").classList.toggle("hidden", !j.urgent);
      $("form").classList.add("hidden"); $("done").classList.remove("hidden");
    } catch (e) {
      $("error").textContent = t("err"); $("error").classList.remove("hidden");
    }
    $("send").disabled = false; $("send").textContent = t("submit");
  });
  $("again").addEventListener("click", () => {
    $("text").value = ""; rating = null;
    document.querySelectorAll("#stars button").forEach(x => x.classList.remove("on"));
    $("done").classList.add("hidden"); $("form").classList.remove("hidden");
  });
</script>
{% endblock %}
