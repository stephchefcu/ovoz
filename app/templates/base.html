<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ovoz{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ V }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block topbar %}
<div class="topbar">
  <a href="/">Ovoz</a>
  <div class="nav">
    {% block nav %}{% endblock %}
  </div>
</div>
{% endblock %}
{% block content %}{% endblock %}
<div class="wrap noprint small muted" style="margin-top:24px;margin-bottom:24px">
  <a href="/privacy{% if clinic is defined and clinic %}?c={{ clinic.slug }}{% endif %}" data-i18n="terms_link">Terms & privacy</a>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
