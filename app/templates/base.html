<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ovoz{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ V }}">
  <link rel="icon" type="image/svg+xml" href="/static/brand/mark-small.svg?v={{ V }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png?v={{ V }}">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png?v={{ V }}">
  <meta name="theme-color" content="#2563eb">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block topbar %}
<div class="topbar">
  <a href="/" class="brand" aria-label="Ovoz home"><img src="/static/brand/wordmark.svg?v={{ V }}" alt="Ovoz" width="97" height="25"></a>
  <nav class="nav-links">{% block nav %}{% endblock %}</nav>
  <div class="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
</div>
{% endblock %}
{% block content %}{% endblock %}
<footer class="foot noprint">
  <a href="/privacy{% if clinic is defined and clinic %}?c={{ clinic.slug }}{% endif %}" data-i18n="terms_link">Terms & privacy</a>
  <span aria-hidden="true">·</span>
  <a href="/pricing" data-i18n="h_pricing">Narxlar</a>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
